services:
  libretv:
    build: .
    # ⚠️ 本项目是 LibreTV 的二开（view163），必须始终用 `docker compose up -d --build`
    # 在本地构建二开代码，切勿拉取上游镜像。默认 image 设为本地标签 view163:latest，
    # 即使漏写 --build 也只会因找不到本地镜像而报错，不会误拉上游 LibreTV 代码。
    # - 需要固定版本时：先 build 后再 `docker tag view163:latest your-registry/view163:vX.Y.Z`
    image: ${LIBRETV_IMAGE:-view163:latest}
    container_name: libretv
    restart: unless-stopped
    ports:
      - "8080:8080"
    # 让容器能用 host.docker.internal 访问宿主机（站内采集反代口 18080 在宿主机 nginx 上）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 无状态服务：观看历史在浏览器 IndexedDB、设置在 localStorage，无需挂载卷
    environment:
      # 访问密码（在 .env 中设置）。公网部署务必设置；仅内网/自用且已开 DISABLE_AUTH 时可不设。
      - PASSWORD=${PASSWORD:-}
      # 可选：设为 true 彻底关闭访问密码（自用/内网部署）。公网开放且未设密码时请勿开启，
      # 否则任何拿到域名的人都能直接使用。
      - DISABLE_AUTH=${DISABLE_AUTH:-false}
      # 可选：会话/代理签名密钥（多实例部署建议显式设置：openssl rand -hex 32）
      # - PROXY_SECRET=your-secret
      # 可选：Cookie Secure 策略覆盖（true=强制开启 / false=强制关闭；不设置时按请求协议自动推导，HTTP 部署无需配置）
      # - COOKIE_SECURE=true
      # 必填（否则全站空）：预置采集站（JSON 数组），用户端自动出现且默认勾选。
      # 实测可用示例（可换成你信任的源；isAdult 标 true 的源会被服务端过滤）：
      #   [{"name":"bfzy","url":"https://bfzyapi.com/api.php/provide/vod","detail":"https://bfzyapi.com","isAdult":false}]
      # 从 .env 读取并注入容器；.env 若为空则全站无内容。
      - DEFAULT_SOURCES=${DEFAULT_SOURCES}
      # 可选：预置数据源订阅（SourceList JSON 链接，一次下发点播源 + 直播源）
      # - DEFAULT_SUBSCRIPTIONS=["https://example.com/sources.json"]
      # 可选：首页推荐数据源默认值（douban / bangumi / hot-list），仅对未主动选择过的用户生效
      # - DEFAULT_RECOMMEND_SOURCE=douban
      # 可选：代理上游请求超时（毫秒）与重试次数
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-8000}
      # - MAX_RETRIES=1
      # 可选：每个搜索源最多抓取的页数（1-50，默认 5），调大会显著增加上游请求量
      # - SEARCH_MAX_PAGES=5
      # 可选：单个搜索源的总死线（毫秒，3s-60s，默认 10000），到点中断该源并标记超时
      - SEARCH_SOURCE_TIMEOUT_MS=${SEARCH_SOURCE_TIMEOUT_MS:-10000}
      # 可选：分类页单页上游超时（毫秒，默认 9000）。源站在境外/慢链路时可调大到 20000
      - CATEGORY_PAGE_TIMEOUT_MS=${CATEGORY_PAGE_TIMEOUT_MS:-9000}
      # 可选：上游请求统一代理（如 mihomo，监听宿主机 7890）。
      # 采集接口(api.php)走此代理出口，绕开服务器 DNS 投毒 / 区域不可达 / Cloudflare 拦截；
      # 媒体(m3u8/ts)由 proxy-handlers 直连优先、代理兜底，不受影响。
      # 例：http://host.docker.internal:7890
      - UPSTREAM_PROXY=${UPSTREAM_PROXY:-}
      # 可选：代理请求 UA（豆瓣防盗链等场景）
      # - USER_AGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122.0.0.0 Safari/537.36
      # 可选：影视榜单推荐源（60s API）实例地址，官方公共实例有限流
      # - 60S_API_BASE=https://60s.crystelf.top
