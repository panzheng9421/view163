# Nginx 反代配置（备选：需自行申请证书，或用 certbot 自动签发）
# 用法：
#   1. 存为 /etc/nginx/sites-available/view163.conf，软链到 sites-enabled
#   2. 证书：certbot --nginx -d view163.com （certbot 会自动改配置加上 443+证书）
#   3. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name view163.com www.view163.com;

    # 80 端口先用于 certbot 验证，验证通过后 certbot 会补充 443 段
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
