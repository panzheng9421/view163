# view163 站点：Next.js standalone 反代到本机 127.0.0.1:8080
# 内置 /__proxy/ 采集源反代：nginx(OpenSSL) 的 TLS 指纹能过源站 CF 校验，
# 而容器里的 Node(undici) 会被按指纹拦截，故后端统一走本机这条。

server {
    listen 80;
    server_name view163.com www.view163.com;

    access_log /www/wwwlogs/view163.com.log;
    error_log  /www/wwwlogs/view163.com.error.log;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/view163.com;
        allow all;
    }

    location /__proxy/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name view163.com www.view163.com;

    ssl_certificate /www/server/panel/vhost/cert/view163.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/view163.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+AESGCM:EECDH+CHACHA20;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /www/wwwlogs/view163.com.log;
    error_log  /www/wwwlogs/view163.com.error.log;

    location /__proxy/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        client_max_body_size 20m;
    }
}

# 内网专用采集反代口（不对公网开放，安全组也没开这个端口）
# 容器通过 docker 网关 172.17.0.1:18080 访问
server {
    listen 0.0.0.0:18080;
    server_name _;

    access_log off;
    error_log /www/wwwlogs/view163.proxy.error.log;

    # /__proxy/<真实host>/<path>  ->  <scheme>://<真实host>/<path>
    location ~ ^/__proxy/([^/]+)/(.*)$ {
        resolver 223.5.5.5 119.29.29.29 valid=10s ipv6=off;

        set $phost $1;
        set $ppath $2;
        set $pscheme https;
        if ($phost ~* "^(caiji\.dyttzyapi\.com|ffzy5\.tv)$") {
            set $pscheme http;
        }

        proxy_pass $pscheme://$phost/$ppath$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $phost;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36";
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_ssl_name $phost;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        return 404;
    }
}
